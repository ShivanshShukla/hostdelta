# Include the log_format in nginx's http {} context.
# Use $uri, not $request_uri: avoid retaining query-string tokens.
# This template never logs request bodies, cookies or authorization headers.
log_format hostdelta escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"request_time":$request_time}';

# Add inside the desired server {} block after reviewing the log path:
# access_log /var/log/nginx/hostdelta-access.log hostdelta;
# Validate your configuration with nginx -t before reloading.
# Then: hostdelta init --access-log /var/log/nginx/hostdelta-access.log
